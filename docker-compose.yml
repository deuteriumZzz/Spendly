name: spendly

x-app: &app
  build: .
  image: spendly:local
  environment:
    DATABASE_URL: postgres://spendly:spendly@postgres:5432/spendly?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spendly
      POSTGRES_PASSWORD: spendly
      POSTGRES_DB: spendly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendly -d spendly"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies migrations once, before the app starts (and before any replica).
  migrate:
    <<: *app
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    env_file:
      - path: .env
        required: false
    ports:
      # No auth on the panel (per the spec), so it listens on localhost by default.
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # docker compose run --rm test — tests against this Postgres, no local Go needed.
  test:
    image: golang:1.26
    profiles: [test]
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://spendly:spendly@postgres:5432/spendly_test?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["go", "test", "-race", "-count=1", "-p", "1", "./..."]

volumes:
  pgdata:
  gomod:
  gocache:
