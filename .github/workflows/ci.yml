name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spendly
          POSTGRES_PASSWORD: spendly
          POSTGRES_DB: spendly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spendly -d spendly"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://spendly:spendly@localhost:5432/spendly_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./... && go vet -tags=eval ./internal/agent
      - name: test
        run: go test -race -count=1 -p 1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spendly:ci .
