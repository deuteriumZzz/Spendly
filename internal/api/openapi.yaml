openapi: 3.0.3
info:
  title: Spendly API
  version: 1.0.0
  description: |
    REST API веб-панели главы семьи. Авторизации нет (по ТЗ), API видит траты одной семьи.
    Суммы — десятичные числа в рублях с двумя знаками (`350.50`), во входных данных можно строкой (`"1 200,50"`).
    Даты — `YYYY-MM-DD`.
paths:
  /api/expenses:
    get:
      summary: Список трат с фильтрами и итогами
      parameters:
        - { name: user_id, in: query, schema: { type: integer, format: int64 }, description: Telegram ID участника }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
        - { name: from, in: query, schema: { type: string, format: date }, description: Начало периода включительно }
        - { name: to, in: query, schema: { type: string, format: date }, description: Конец периода включительно }
        - { name: text, in: query, schema: { type: string }, description: Подстрока комментария }
        - { name: order, in: query, schema: { type: string, enum: [spent_at, created_at], default: spent_at } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Траты (новые сверху) и итоги по всему фильтру без учёта limit/offset
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Expense' } }
                  summary: { $ref: '#/components/schemas/Summary' }
                  by_user:
                    type: array
                    description: Суммы по участникам семьи, по убыванию
                    items: { $ref: '#/components/schemas/UserTotal' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      summary: Создать трату
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '201':
          description: Созданная трата
          content: { application/json: { schema: { $ref: '#/components/schemas/Expense' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/expenses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      summary: Изменить трату (передаются только меняемые поля)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpensePatch' }
      responses:
        '200':
          description: Изменённая трата
          content: { application/json: { schema: { $ref: '#/components/schemas/Expense' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Удалить трату
      responses:
        '204': { description: Удалено }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/users:
    get:
      summary: Участники семьи
      responses:
        '200':
          description: Участники по имени
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
  /api/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: Telegram ID }
    patch:
      summary: Переименовать участника («Мария Иванова» → «Мама»)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NameInput' } } }
      responses:
        '200':
          description: Участник с новым именем
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/invites:
    post:
      summary: Пригласить в семью
      description: >
        Одноразовая ссылка на бота на 7 дней. Человек открывает её и нажимает «Запустить» —
        бот получает код как `/start <code>` и добавляет его в семью под указанным именем.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NameInput' } } }
      responses:
        '201':
          description: Приглашение
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  expires_at: { type: string, format: date-time }
                  url: { type: string, example: 'https://t.me/spendly_bot?start=K7QXM2…' }
                  qr_svg: { type: string, description: QR-код ссылки, SVG чёрным по белому }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503':
          description: Бот не запущен (нет TELEGRAM_TOKEN) — ссылку не на что дать
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /api/categories:
    get:
      summary: Допустимые категории
      responses:
        '200':
          description: Категории в порядке показа
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Category' } }
  /healthz:
    get:
      summary: Проверка готовности (доступность БД)
      responses:
        '200': { description: OK }
        '503': { description: БД недоступна }
components:
  schemas:
    Category:
      type: string
      enum: [еда, транспорт, жильё, развлечения, здоровье, покупки, другое]
    Expense:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64, description: Telegram ID владельца }
        user_name: { type: string }
        amount: { type: number, example: 350.50 }
        category: { $ref: '#/components/schemas/Category' }
        spent_at: { type: string, format: date }
        comment: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExpenseInput:
      type: object
      required: [user_id, amount, category, spent_at]
      properties:
        user_id: { type: integer, format: int64 }
        amount: { oneOf: [{ type: number }, { type: string }], example: 350.5 }
        category: { $ref: '#/components/schemas/Category' }
        spent_at: { type: string, format: date, description: Не позже сегодняшнего дня }
        comment: { type: string, maxLength: 500 }
    ExpensePatch:
      type: object
      minProperties: 1
      properties:
        user_id: { type: integer, format: int64, description: Передать трату другому участнику семьи }
        amount: { oneOf: [{ type: number }, { type: string }] }
        category: { $ref: '#/components/schemas/Category' }
        spent_at: { type: string, format: date }
        comment: { type: string, maxLength: 500 }
    Summary:
      type: object
      properties:
        count: { type: integer }
        total: { type: number }
        by_category: { type: object, additionalProperties: { type: number } }
    UserTotal:
      type: object
      properties:
        user_id: { type: integer, format: int64 }
        name: { type: string }
        count: { type: integer }
        total: { type: number }
    User:
      type: object
      properties:
        id: { type: integer, format: int64, description: Telegram ID }
        name: { type: string }
    NameInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40, example: Мама }
    Error:
      type: object
      properties:
        error: { type: string }
        field: { type: string }
  responses:
    BadRequest:
      description: Ошибка во входных данных
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Трата или участник не найдены
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
